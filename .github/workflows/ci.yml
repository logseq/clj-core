name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["5.5.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-ocaml-${{ matrix.ocaml-compiler }}-opam-${{ hashFiles('*.opam', '*.opam.template') }}
          restore-keys: |
            ${{ runner.os }}-ocaml-${{ matrix.ocaml-compiler }}-opam-

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Save opam switch cache
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Build
        run: opam exec -- dune build @install

      - name: Run tests
        run: opam exec -- dune runtest
